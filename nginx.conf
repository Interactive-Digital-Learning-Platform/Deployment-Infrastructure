events {}

http {
    upstream pdf_ingestion_backend {
        server host.docker.internal:8001;
    }

    upstream learning_assistant_backend {
        server host.docker.internal:8002;
    }

    upstream learning_assistant_mcp_backend {
        server host.docker.internal:8006;
    }

    upstream personalized_quiz_backend {
        server host.docker.internal:8003;
    }

    upstream handwritten_notes_backend {
        server host.docker.internal:8004;
    }

    # Local object storage (MinIO). Only used to serve presigned GET URLs for
    # PDFs generated by the MCP server. In production the MCP server signs these
    # against the public Cloudflare R2 endpoint and the gateway is not involved.
    upstream object_storage_backend {
        server host.docker.internal:9000;
    }

    server {
        listen 80;
        server_name _;

        # PDF uploads can be as large as 100 MB in the ingestion service.
        client_max_body_size 110m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Avoid buffering streaming assistant and ingestion progress responses.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"api-gateway"}\n';
        }

        location = /api/pdf {
            return 308 /api/pdf/;
        }

        # /api/pdf/ingest/... -> /ingest/...
        location /api/pdf/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Prefix /api/pdf;
            proxy_pass http://pdf_ingestion_backend/;
        }

        location = /api/assistant {
            return 308 /api/assistant/;
        }

        # /api/assistant/conversations/... -> /conversations/...
        location /api/assistant/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Prefix /api/assistant;
            proxy_pass http://learning_assistant_backend/;
        }

        location = /api/mcp {
            return 308 /api/mcp/;
        }

        # The MCP endpoint is /mcp (no trailing slash); the server redirects
        # /mcp/ -> /mcp with an absolute URL pointing at the internal host.
        # Normalise here so that redirect is never exposed to clients.
        location = /api/mcp/mcp/ {
            return 308 /api/mcp/mcp;
        }

        # Learning Assistant MCP server (Streamable HTTP).
        # /api/mcp/mcp    -> /mcp      (the MCP endpoint)
        # /api/mcp/health -> /health
        location /api/mcp/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Prefix /api/mcp;

            # MCP sessions are long-lived and stream responses; keep them open
            # and unbuffered end to end.
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Keep any upstream absolute redirect on the gateway origin/prefix.
            proxy_redirect ~^https?://[^/]+/(.*)$ /api/mcp/$1;

            proxy_pass http://learning_assistant_mcp_backend/;
        }

        location = /api/quiz {
            return 308 /api/quiz/;
        }

        # /api/quiz/api/v1/quiz/... -> /api/v1/quiz/...
        location /api/quiz/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Prefix /api/quiz;
            proxy_pass http://personalized_quiz_backend/;
        }

        location = /api/notes {
            return 308 /api/notes/;
        }

        # /api/notes/api/notes/... -> /api/notes/...
        location /api/notes/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Prefix /api/notes;
            proxy_pass http://handwritten_notes_backend/;
        }

        # Presigned PDF downloads. The MCP server signs SigV4 URLs against this
        # gateway's origin with path-style addressing, so:
        #  - the /<bucket>/<key> path must reach MinIO byte-for-byte (no prefix
        #    strip, no trailing slash on proxy_pass), and
        #  - the Host header MinIO sees must be the exact host:port that was
        #    signed, so forward $http_host verbatim (not $host, which drops the
        #    port and breaks the signature).
        # Only requests carrying a valid signature succeed; the bucket is private.
        location /learning-documents/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_pass http://object_storage_backend;
        }

        location / {
            default_type application/json;
            return 404 '{"detail":"Unknown API gateway route"}\n';
        }
    }
}
