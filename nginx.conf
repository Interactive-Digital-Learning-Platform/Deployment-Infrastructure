events {}

http {
    upstream pdf_ingestion_backend {
        server host.docker.internal:8001;
    }

    upstream learning_assistant_backend {
        server host.docker.internal:8002;
    }

    upstream personalized_quiz_backend {
        server host.docker.internal:8003;
    }

    upstream handwritten_notes_backend {
        server host.docker.internal:8004;
    }

    server {
        listen 80;
        server_name _;

        # PDF uploads can be as large as 100 MB in the ingestion service.
        client_max_body_size 110m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Avoid buffering streaming assistant and ingestion progress responses.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"api-gateway"}\n';
        }

        location = /api/pdf {
            return 308 /api/pdf/;
        }

        # /api/pdf/ingest/... -> /ingest/...
        location /api/pdf/ {
            proxy_set_header X-Forwarded-Prefix /api/pdf;
            proxy_pass http://pdf_ingestion_backend/;
        }

        location = /api/assistant {
            return 308 /api/assistant/;
        }

        # /api/assistant/conversations/... -> /conversations/...
        location /api/assistant/ {
            proxy_set_header X-Forwarded-Prefix /api/assistant;
            proxy_pass http://learning_assistant_backend/;
        }

        location = /api/quiz {
            return 308 /api/quiz/;
        }

        # /api/quiz/api/v1/quiz/... -> /api/v1/quiz/...
        location /api/quiz/ {
            proxy_set_header X-Forwarded-Prefix /api/quiz;
            proxy_pass http://personalized_quiz_backend/;
        }

        location = /api/notes {
            return 308 /api/notes/;
        }

        # /api/notes/api/notes/... -> /api/notes/...
        location /api/notes/ {
            proxy_set_header X-Forwarded-Prefix /api/notes;
            proxy_pass http://handwritten_notes_backend/;
        }

        location / {
            default_type application/json;
            return 404 '{"detail":"Unknown API gateway route"}\n';
        }
    }
}
