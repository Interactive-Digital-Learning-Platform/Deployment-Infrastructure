events {}

http {
    # Default "combined" log with any token= query value replaced by [REDACTED].
    map $request $request_redacted {
        "~^(?<before>.*[?&]token=)[^&\s]*(?<after>.*)$"  "${before}[REDACTED]${after}";
        default                                           $request;
    }
    log_format redacted '$remote_addr - $remote_user [$time_local] "$request_redacted" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log redacted;

    upstream pdf_ingestion_backend {
        server host.docker.internal:8001;
    }

    upstream learning_assistant_backend {
        server host.docker.internal:8002;
    }

    upstream learning_assistant_mcp_backend {
        server host.docker.internal:8006;
    }

    upstream personalized_quiz_backend {
        server host.docker.internal:8003;
    }

    upstream handwritten_notes_backend {
        server host.docker.internal:8004;
    }

    upstream quiz_battle_backend {
        server host.docker.internal:8005;
    }

    # Local MinIO, only for presigned PDF downloads (production uses Cloudflare R2).
    upstream object_storage_backend {
        server host.docker.internal:9000;
    }

    server {
        listen 80;
        server_name _;

        # PDF uploads can be up to 100 MB.
        client_max_body_size 110m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Don't buffer streamed responses.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"api-gateway"}\n';
        }

        location = /api/pdf {
            return 308 /api/pdf/;
        }

        # /api/pdf/ingest/... -> /ingest/...
        location /api/pdf/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Prefix /api/pdf;
            proxy_pass http://pdf_ingestion_backend/;
        }

        location = /api/assistant {
            return 308 /api/assistant/;
        }

        # /api/assistant/conversations/... -> /conversations/...
        location /api/assistant/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Prefix /api/assistant;
            proxy_pass http://learning_assistant_backend/;
        }

        location = /api/mcp {
            return 308 /api/mcp/;
        }

        # Normalise /mcp/ -> /mcp here so the upstream's internal-host redirect never reaches clients.
        location = /api/mcp/mcp/ {
            return 308 /api/mcp/mcp;
        }

        # /api/mcp/... -> /... (MCP server, Streamable HTTP)
        location /api/mcp/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Prefix /api/mcp;

            # Long-lived streaming MCP sessions: unbuffered, 1h timeouts.
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Rewrite upstream absolute redirects onto the gateway prefix.
            proxy_redirect ~^https?://[^/]+/(.*)$ /api/mcp/$1;

            proxy_pass http://learning_assistant_mcp_backend/;
        }

        location = /api/quiz {
            return 308 /api/quiz/;
        }

        # /api/quiz/api/v1/quiz/... -> /api/v1/quiz/...
        location /api/quiz/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Prefix /api/quiz;
            proxy_pass http://personalized_quiz_backend/;
        }

        location = /api/notes {
            return 308 /api/notes/;
        }

        # /api/notes/api/notes/... -> /api/notes/...
        location /api/notes/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Prefix /api/notes;
            proxy_pass http://handwritten_notes_backend/;
        }

        location = /api/battle {
            return 308 /api/battle/;
        }

        # /api/battle/api/v1/battle/... -> /api/v1/battle/... (including the match WebSocket)
        location /api/battle/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Prefix /api/battle;
            proxy_pass http://quiz_battle_backend/;
        }

        # Presigned PDF downloads: path and Host ($http_host, keeps the port) must reach MinIO unchanged or the signature breaks.
        location /learning-documents/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_pass http://object_storage_backend;
        }

        location / {
            default_type application/json;
            return 404 '{"detail":"Unknown API gateway route"}\n';
        }
    }
}
